<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-2.5">
    <div *ngFor="let toast of toastService.toasts$ | async"
        class="bg-white px-5 py-3 rounded-lg shadow-[0_4px_12px_rgba(0,0,0,0.15)] flex items-center min-w-[300px] animate-slideIn border-l-4"
        [class.border-emerald-500]="toast.type === 'success'" [class.border-red-500]="toast.type === 'error'"
        [class.border-blue-500]="toast.type === 'info'">
        <span class="text-sm text-gray-800 flex-1">{{ toast.message }}</span>
        <button class="bg-none border-none ml-2.5 cursor-pointer text-lg text-gray-400 hover:text-gray-800"
            (click)="toastService.remove(toast.id)">×</button>
    </div>
</div>
