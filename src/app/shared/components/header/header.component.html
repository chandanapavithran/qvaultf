<header
    class="flex flex-col md:flex-row justify-between items-center px-6 md:px-12 py-4 md:py-6 bg-white sticky top-0 z-50 gap-4 md:gap-0">
    <!-- Left: Qvault -->
    <div class="w-full md:w-1/4 flex justify-center md:justify-start cursor-pointer" routerLink="/landing">
        <img src="assets/images/qvault-logo.jpg" alt="Qvault" class="h-8 object-contain">
    </div>

    <!-- Center: Kristu Jayanti -->
    <div class="w-full md:w-2/4 flex justify-center cursor-pointer" routerLink="/landing">
        <img src="assets/images/kristu-logo.png" alt="Kristu Jayanti College" class="h-10 md:h-12 object-contain">
    </div>

    <!-- Right: Profile -->
    <div class="w-full md:w-1/4 flex justify-center md:justify-end items-center gap-4 relative">
        <div class="text-right hidden md:block">
            <p class="text-sm font-bold text-gray-900">{{ user.email }}</p>
        </div>

        <!-- Dynamic Avatar -->
        <button (click)="toggleProfileMenu()"
            class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center font-bold text-sm border-2 border-white shadow-md hover:ring-2 hover:ring-green-300 transition-all focus:outline-none">
            {{ user.initials }}
        </button>

        <!-- Profile Dropdown Card -->
        <div *ngIf="showProfileMenu"
            class="absolute top-14 right-0 md:right-0 w-80 bg-white rounded-3xl shadow-2xl border border-gray-100 p-6 z-[100] flex flex-col items-center animate-fade-in-down">
            <!-- Avatar Large -->
            <div
                class="w-24 h-24 rounded-full bg-green-500 text-white flex items-center justify-center text-3xl font-bold mb-4 shadow-inner">
                <img *ngIf="false" src="assets/avatar-3d.png" alt="Avatar"
                    class="w-full h-full object-cover rounded-full">
                {{ user.initials }}
            </div>

            <!-- User Info -->
            <h3 class="text-xl font-bold text-gray-900 mb-1">{{ user.name || 'User' }}</h3>
            <p class="text-sm text-gray-500 mb-8">{{ user.email }}</p>

            <!-- Logout Button -->
            <button (click)="logout()"
                class="flex items-center gap-2 px-6 py-3 bg-gray-400 text-gray-900 font-semibold rounded-full hover:bg-gray-300 transition-colors w-full justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
                </svg>
                Log out
            </button>
        </div>

        <button class="text-gray-400 hover:text-red-500 transition-colors" routerLink="/favorites">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
            </svg>
        </button>
    </div>
</header>
