<div class="min-h-screen bg-white flex flex-col font-sans">
    <!-- Header -->


    <main class="flex-grow p-8">
        <!-- Main Content Container -->
        <div class="max-w-7xl mx-auto">

            <div *ngIf="(favorites$ | async) as favorites">
                <!-- Header Section -->
                <div class="flex items-center gap-3 mb-8">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-8 h-8 text-red-500">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                    </svg>
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-900">Your Favorites</h1>
                        <p *ngIf="favorites.length > 0" class="text-sm text-gray-500">{{ favorites.length }} saved
                            question papers</p>
                    </div>
                </div>

                <!-- Empty State -->
                <div *ngIf="favorites.length === 0" class="flex flex-col items-center justify-center mt-20">
                    <div class="w-24 h-24 mb-6 text-gray-300">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="w-full h-full">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                        </svg>
                    </div>
                    <h2 class="text-lg font-medium text-gray-900 mb-2">No Favorites Yet</h2>
                    <p class="text-gray-500 mb-8 max-w-md text-center">Start adding question papers to your favorites to
                        access them quickly later.</p>
                    <button routerLink="/search"
                        class="px-6 py-2 bg-black text-white rounded-md text-sm font-medium hover:bg-gray-800 transition-colors">
                        Browse Question Papers
                    </button>
                </div>

                <!-- Populated State (Grid) -->
                <div *ngIf="favorites.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div *ngFor="let paper of favorites"
                        class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start mb-4">
                            <div
                                class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                                </svg>
                            </div>
                            <span class="bg-green-100 text-green-700 text-xs font-semibold px-2 py-1 rounded">{{
                                paper.year }}</span>
                        </div>

                        <div class="mb-4">
                            <h3 class="font-semibold text-gray-900 leading-tight mb-1">{{ paper.subjectName }}</h3>
                            <p class="text-xs text-blue-600 font-medium mb-1">{{ paper.subjectCode }}</p>
                            <p class="text-xs text-gray-500">{{ paper.examType }}</p>
                        </div>

                        <div class="flex items-center justify-between mt-4">
                            <button class="text-red-500 hover:text-red-700 transition-colors"
                                (click)="removeFromFavorites(paper)">
                                <!-- Filled Heart (Default) -->
                                <svg *ngIf="!removingIds.has(paper.id)" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                                    <path
                                        d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
                                </svg>
                                <!-- Outline Heart (Removing) -->
                                <svg *ngIf="removingIds.has(paper.id)" xmlns="http://www.w3.org/2000/svg" fill="none"
                                    viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
                                </svg>
                            </button>
                            <div class="flex gap-2">
                                <button (click)="viewPaper(paper)"
                                    class="px-4 py-1.5 bg-blue-600 text-white text-xs font-medium rounded-full hover:bg-blue-700 transition-colors">
                                    View
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
