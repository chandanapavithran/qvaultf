<div class="flex min-h-screen bg-qv-bg-light font-sans">
    <!-- Left Side: Form -->
    <div class="w-full md:w-1/2 flex flex-col justify-center items-center p-8 md:p-12 bg-white">
        <div class="w-full max-w-[420px]">
            <!-- Header/Logo -->
            <div class="mb-10 text-left">
                <div class="mb-6">
                    <img src="assets/images/kristu-logo.png" alt="Kristu Jayanti" class="h-12 object-contain">
                </div>
                <div class="flex justify-center my-8">
                    <img src="assets/images/qvault-logo.jpg" alt="Qvault" class="h-16 object-contain">
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Verify OTP</h1>
            <p class="text-gray-500 mb-8 text-sm">Enter the 4-digit code sent to your email</p>

            <!-- Form -->
            <div class="space-y-6">
                <div class="flex justify-center gap-2 md:gap-4">
                    <ng-container *ngFor="let digit of otpDigits; let i = index">
                        <input type="text" maxlength="1" [(ngModel)]="otpDigits[i]" [name]="'otp-' + i"
                            [id]="'otp-' + i" (keydown)="onKeyDown(i, $event)"
                            class="w-10 h-10 md:w-12 md:h-12 rounded-lg border border-qv-input-border text-center text-xl font-bold text-gray-800 focus:outline-none focus:border-qv-primary focus:ring-1 focus:ring-qv-primary bg-qv-input-bg transition-colors">
                    </ng-container>
                </div>

                <button
                    class="w-full h-12 bg-qv-gradient-btn text-white rounded-lg font-semibold text-base shadow-[0_4px_10px_rgba(124,123,237,0.3)] hover:shadow-[0_6px_15px_rgba(124,123,237,0.4)] transition-all transform active:scale-[0.98]"
                    (click)="verifyOtp()">Verify</button>

                <div class="mt-6 flex justify-center gap-2 text-sm">
                    <a (click)="resendCode()"
                        class="font-semibold text-qv-primary hover:text-qv-secondary cursor-pointer transition-colors no-underline">Resend
                        Code</a>
                    <span class="text-gray-400">|</span>
                    <a routerLink="/login"
                        class="font-semibold text-qv-primary hover:text-qv-secondary transition-colors no-underline">Back
                        to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Side: Illustration -->
    <div
        class="hidden md:flex md:w-1/2 bg-qv-purple-soft justify-center items-center p-12 relative overflow-hidden rounded-bl-[100px]">
        <div class="absolute inset-0 bg-qv-purple-soft"></div>
        <div class="relative z-10 w-full max-w-[600px]">
            <img src="assets/images/login-illustration.png" alt="Students Learning"
                class="w-full h-auto object-contain">
        </div>
    </div>
</div>
