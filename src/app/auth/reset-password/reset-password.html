<div class="flex min-h-screen bg-qv-bg-light font-sans">
    <!-- Left Side: Form -->
    <div class="w-full md:w-1/2 flex flex-col justify-center items-center p-8 md:p-12 bg-white">
        <div class="w-full max-w-[420px]">
            <!-- Header/Logo -->
            <div class="mb-10 text-left">
                <div class="mb-6">
                    <img src="assets/images/kristu-logo.png" alt="Kristu Jayanti" class="h-12 object-contain">
                </div>
                <div class="flex justify-center my-8">
                    <img src="assets/images/qvault-logo.jpg" alt="Qvault" class="h-16 object-contain">
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Set New Password</h1>
            <p class="text-gray-500 mb-8 text-sm">Create a strong password for your account</p>

            <!-- Form -->
            <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="space-y-4">
                <!-- Success/Error Message -->
                <div *ngIf="showMessage"
                    [ngClass]="{'bg-green-100 text-green-700 border-green-400': messageType === 'success', 'bg-red-100 text-red-700 border-red-400': messageType === 'error'}"
                    class="px-4 py-3 rounded relative border mb-4" role="alert">
                    <span class="block sm:inline">{{ message }}</span>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2 ml-1">New Password</label>
                    <div class="relative">
                        <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                            class="w-full h-12 px-4 border border-qv-input-border rounded-lg text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-qv-input-bg transition-colors"
                            [ngClass]="{ 'border-red-500': submitted && resetForm.get('password')?.errors }">
                        <button type="button" (click)="togglePasswordVisibility()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-qv-primary focus:outline-none transition-colors">
                            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    <div *ngIf="submitted && resetForm.get('password')?.errors" class="text-red-500 text-xs mt-1">
                        <div *ngIf="resetForm.get('password')?.hasError('required')">Password is required</div>
                        <div *ngIf="resetForm.get('password')?.hasError('minlength')">Password must be at least 6
                            characters</div>
                        <div *ngIf="resetForm.get('password')?.hasError('weakPassword')">Password must contain
                            lowercase, uppercase, and special char</div>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-semibold mb-2 ml-1">Confirm Password</label>
                    <div class="relative">
                        <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword"
                            class="w-full h-12 px-4 border border-qv-input-border rounded-lg text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-qv-input-bg transition-colors"
                            [ngClass]="{ 'border-red-500': submitted && (resetForm.get('confirmPassword')?.errors || resetForm.hasError('passwordMismatch')) }">
                        <button type="button" (click)="toggleConfirmPasswordVisibility()"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-qv-primary focus:outline-none transition-colors">
                            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                    <div *ngIf="submitted && (resetForm.get('confirmPassword')?.errors || resetForm.hasError('passwordMismatch'))"
                        class="text-red-500 text-xs mt-1">
                        <div *ngIf="resetForm.get('confirmPassword')?.hasError('required')">Confirm Password is required
                        </div>
                        <div *ngIf="resetForm.hasError('passwordMismatch')">Passwords do not match</div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full h-12 bg-qv-gradient-btn text-white rounded-lg font-semibold text-base shadow-[0_4px_10px_rgba(124,123,237,0.3)] hover:shadow-[0_6px_15px_rgba(124,123,237,0.4)] transition-all transform active:scale-[0.98]">
                        Set New Password
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Right Side: Illustration -->
    <div
        class="hidden md:flex md:w-1/2 bg-qv-purple-soft justify-center items-center p-12 relative overflow-hidden rounded-bl-[100px]">
        <div class="absolute inset-0 bg-qv-purple-soft"></div>
        <div class="relative z-10 w-full h-full flex justify-center items-center">
            <img src="assets/images/login-illustration.png" alt="Students Learning"
                class="w-[90%] h-auto object-contain max-w-none">
        </div>
    </div>
</div>
